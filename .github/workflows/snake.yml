name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Sudalaimani777
          outputs: |
           dist/github-contribution-grid-snake.svg?palette=github&color_snake=%2360A5FA&color_dots=%23ebedf0,%23DBEAFE,%233B82F6,%231D4ED8,%23051275

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
